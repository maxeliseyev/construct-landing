<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Add contact to Konstruct Messenger">
    <title>Konstruct - Add Contact</title>
    
    <!-- Preload critical CSS -->
    <link rel="preload" href="/styles.css?v=20260812-lang" as="style" />
    <link rel="preload" href="/contact.css?v=20260812-lang" as="style" />
    <link rel="stylesheet" href="/styles.css?v=20260812-lang" />
    <link rel="stylesheet" href="/contact.css?v=20260812-lang" />
</head>
<body>
    <main class="contact-page">
        <div class="contact-container" role="main">
            <h1>Add Contact</h1>
            <div class="username" id="username" aria-live="polite">@username</div>
            <p class="message" id="message">
                Click the button below to open this contact in Konstruct Messenger app.
            </p>
            
            <nav aria-label="Contact actions">
                <a href="#" class="button" id="openAppButton" aria-label="Open contact in Konstruct Messenger app">
                    Open in app
                </a>
            </nav>

            <div class="loading" id="loading" aria-live="polite" aria-busy="true" hidden>
                <div class="spinner" aria-label="Loading"></div>
                <p style="margin-top: 12px; color: var(--fg-muted);">Attempting to open app...</p>
            </div>
            
            <div class="error" id="error" role="alert" aria-live="assertive" hidden></div>
        </div>
    </main>

    <script src="/contact.js" defer></script>
</body>
</html>
