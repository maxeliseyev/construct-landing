<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Add contact to Konstruct Messenger">
    <title>Konstruct - Add Contact</title>
    
    <!-- Preload critical CSS -->
    <link rel="preload" href="/styles.css" as="style" />
    <link rel="preload" href="/contact.css" as="style" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/contact.css" />
</head>
<body>
    <main class="contact-page">
        <div class="contact-container" role="main">
            <h1>Add Contact</h1>
            <div class="username" id="username" aria-live="polite">@username</div>
            <p class="message" id="message">
                Click the button below to open this contact in Konstruct Messenger app.
            </p>
            
            <nav aria-label="Contact actions">
                <a href="#" class="button" id="openAppButton" onclick="openInApp(event)" aria-label="Open contact in Konstruct Messenger app">
                    Open in app
                </a>
                <a href="#" class="button secondary" id="openWebButton" onclick="openInWeb(event)" aria-label="Open contact in web version">
                    Open in web version
                </a>
            </nav>
            
            <div class="loading" id="loading" aria-live="polite" aria-busy="true" hidden>
                <div class="spinner" aria-label="Loading"></div>
                <p style="margin-top: 12px; color: var(--muted);">Attempting to open app...</p>
            </div>
            
            <div class="error" id="error" role="alert" aria-live="assertive" hidden></div>
        </div>
    </main>

    <script>
        // Parse URL parameters
        // Try to get userId from path first: /c/{userId}
        let userId = null;
        const pathParts = window.location.pathname.split('/').filter(part => part.length > 0);
        if (pathParts.length >= 2 && pathParts[0] === 'c') {
            userId = pathParts[1];
        }
        
        // Fallback to query parameter if not in path
        const urlParams = new URLSearchParams(window.location.search);
        if (!userId) {
            userId = urlParams.get('userId');
        }
        const username = urlParams.get('username');
        
        // Update UI
        if (username) {
            document.getElementById('username').textContent = '@' + username;
        } else {
            document.getElementById('username').style.display = 'none';
        }
        
        // Validate userId
        if (!userId) {
            const errorEl = document.getElementById('error');
            errorEl.hidden = false;
            errorEl.textContent = 'Error: User ID not specified';
            document.getElementById('openAppButton').style.display = 'none';
            document.getElementById('openWebButton').style.display = 'none';
        }
        
        // Universal link for iOS
        const universalLink = window.location.href;
        
        // Custom URL scheme fallback (if needed in future)
        const appScheme = 'konstruct://contact?userId=' + encodeURIComponent(userId || '') + '&username=' + encodeURIComponent(username || '');
        
        function openInApp(event) {
            event.preventDefault();
            
            const openAppBtn = document.getElementById('openAppButton');
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            
            openAppBtn.style.display = 'none';
            loading.hidden = false;
            error.hidden = true;
            
            // Try universal link first (for iOS)
            // This will be handled by iOS if the app is installed
            window.location.href = universalLink;
            
            // Fallback: try custom URL scheme
            setTimeout(() => {
                window.location.href = appScheme;
            }, 500);
            
            // If still not opened after 2 seconds, show error
            setTimeout(() => {
                loading.hidden = true;
                error.hidden = false;
                error.textContent = 'App is not installed. Please install Konstruct Messenger from the App Store.';
                openAppButton.style.display = 'inline-block';
            }, 2000);
        }
        
        function openInWeb(event) {
            event.preventDefault();
            if (userId) {
                const pwaUrl = 'https://web.konstruct.cc/contact?userId=' + encodeURIComponent(userId) + '&username=' + encodeURIComponent(username || '');
                window.location.href = pwaUrl;
            } else {
                window.location.href = 'https://web.konstruct.cc';
            }
        }
        
        // Auto-redirect for PWA (optional - uncomment if needed)
        // if (window.location.hostname === 'web.konstruct.cc') {
        //     // If on web version, redirect to PWA with contact info
        //     const pwaUrl = 'https://web.konstruct.cc/contact?userId=' + encodeURIComponent(userId) + '&username=' + encodeURIComponent(username || '');
        //     window.location.href = pwaUrl;
        // }
    </script>
</body>
</html>
