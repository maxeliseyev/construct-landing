name: Update relay SPKI

# Triggers:
#   1. Automatic: daily at 03:00 UTC (catches cert rotations even without a relay push)
#   2. Manual: workflow_dispatch from GitHub UI
#   3. Webhook: repository_dispatch from construct-relay after a new deploy
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [relay_cert_rotated]

jobs:
  update-spki:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install cryptography
        run: pip install cryptography --quiet

      - name: Fetch live SPKI — AMS relay (ice.ams.konstruct.cc:443)
        id: spki_ams
        run: |
          SPKI=$(python3 - <<'PYEOF'
          import ssl, socket, hashlib
          from cryptography import x509
          from cryptography.hazmat.primitives import serialization
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          with socket.create_connection(("ice.ams.konstruct.cc", 443), timeout=10) as sock:
              with ctx.wrap_socket(sock, server_hostname="ice.ams.konstruct.cc") as s:
                  cert = x509.load_der_x509_certificate(s.getpeercert(binary_form=True))
                  pub_der = cert.public_key().public_bytes(
                      serialization.Encoding.DER,
                      serialization.PublicFormat.SubjectPublicKeyInfo)
                  print(hashlib.sha256(pub_der).hexdigest(), end='')
          PYEOF
          )
          if [[ -z "$SPKI" ]]; then
            echo "❌ Failed to fetch SPKI from AMS relay — server unreachable?"
            exit 1
          fi
          echo "spki=$SPKI" >> "$GITHUB_OUTPUT"
          echo "AMS relay SPKI: $SPKI"

      - name: Fetch live SPKI — RU relay (api.divany-kresla.uk:443)
        id: spki_ru
        run: |
          SPKI=$(python3 - <<'PYEOF'
          import ssl, socket, hashlib
          from cryptography import x509
          from cryptography.hazmat.primitives import serialization
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          with socket.create_connection(("api.divany-kresla.uk", 443), timeout=10) as sock:
              with ctx.wrap_socket(sock, server_hostname="api.divany-kresla.uk") as s:
                  cert = x509.load_der_x509_certificate(s.getpeercert(binary_form=True))
                  pub_der = cert.public_key().public_bytes(
                      serialization.Encoding.DER,
                      serialization.PublicFormat.SubjectPublicKeyInfo)
                  print(hashlib.sha256(pub_der).hexdigest(), end='')
          PYEOF
          )
          if [[ -z "$SPKI" ]]; then
            echo "❌ Failed to fetch SPKI from RU relay — server unreachable?"
            exit 1
          fi
          echo "spki=$SPKI" >> "$GITHUB_OUTPUT"
          echo "RU relay SPKI: $SPKI"

      - name: Patch SPKI in config
        run: |
          python3 - '${{ steps.spki_ams.outputs.spki }}' '${{ steps.spki_ru.outputs.spki }}' <<'PYEOF'
          import json, sys
          spki_ams, spki_ru = sys.argv[1], sys.argv[2]
          path = '.well-known/construct-server'
          with open(path) as f:
              data = json.load(f)
          spki_map = {'ams-het-1': spki_ams, 'ru-div-1': spki_ru}
          for relay in data.get('veil', {}).get('relays', []):
              relay_id = relay.get('id')
              if relay_id in spki_map:
                  relay['spki_sha256'] = spki_map[relay_id]
                  print(f"Patched {relay_id} spki_sha256 → {spki_map[relay_id]}")
          with open(path, 'w') as f:
              json.dump(data, f, indent=2, sort_keys=True)
              f.write('\n')
          PYEOF

      - name: Re-sign config
        env:
          RELAY_SIGNING_KEY_PEM: ${{ secrets.RELAY_SIGNING_KEY_PEM }}
        run: |
          # Write key to ephemeral temp file — deleted in the same step
          if [[ -z "$RELAY_SIGNING_KEY_PEM" ]]; then
            echo "❌ RELAY_SIGNING_KEY_PEM secret is not set"
            exit 1
          fi

          KEYFILE=$(mktemp)
          chmod 600 "$KEYFILE"
          # Use echo to preserve newlines — printf '%s' strips them on some runners
          echo "$RELAY_SIGNING_KEY_PEM" > "$KEYFILE"

          CONFIG=".well-known/construct-server"

          # Canonical JSON: remove "signature", update signed_at, sort keys, compact
          CANONICAL=$(python3 - "$CONFIG" <<'PYEOF'
          import json, sys
          from datetime import datetime, timezone
          with open(sys.argv[1]) as f:
              data = json.load(f)
          data.pop("signature", None)
          data["signed_at"] = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          print(json.dumps(data, sort_keys=True, separators=(',', ':')), end='')
          PYEOF
          )

          TMPFILE=$(mktemp)
          printf '%s' "$CANONICAL" > "$TMPFILE"

          SIG=$(openssl pkeyutl -sign -inkey "$KEYFILE" -in "$TMPFILE" -rawin \
            | base64 | tr '+/' '-_' | tr -d '=\n')

          if [[ -z "$SIG" ]]; then
            echo "❌ Signing failed — SIG is empty. Check RELAY_SIGNING_KEY_PEM format."
            rm -f "$KEYFILE" "$TMPFILE"
            exit 1
          fi

          # Write final file with signature
          python3 - "$CONFIG" "$CANONICAL" "$SIG" <<'PYEOF'
          import json, sys
          config_path, canonical_str, sig = sys.argv[1], sys.argv[2], sys.argv[3]
          data = json.loads(canonical_str)
          data["signature"] = "ed25519:" + sig
          with open(config_path, 'w') as f:
              json.dump(data, f, indent=2, sort_keys=True)
              f.write('\n')
          PYEOF

          # Cleanup — key never persists
          rm -f "$KEYFILE" "$TMPFILE"
          echo "✅ Config re-signed"

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet .well-known/construct-server; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ SPKI unchanged — no commit needed"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff .well-known/construct-server
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .well-known/construct-server
          git commit -m "chore(veil): auto-update relay SPKI

          ams-het-1: ${{ steps.spki_ams.outputs.spki }}
          ru-div-1:  ${{ steps.spki_ru.outputs.spki }}

          Live SPKI fetched and config re-signed by GitHub Actions.
          Trigger: ${{ github.event_name }}"
          git push
