name: ICE smoke test

on:
  # After SPKI update — verify result
  workflow_run:
    workflows: ["Update relay SPKI"]
    types: [completed]
  # Daily check
  schedule:
    - cron: '30 3 * * *'
  # Manual
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install cryptography

      - name: Run ICE smoke test
        run: python3 tests/ice_smoke_test.py --ci

      - name: JSON output (artifact on failure)
        if: failure()
        run: python3 tests/ice_smoke_test.py --json > /tmp/ice-test-result.json

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ice-test-result
          path: /tmp/ice-test-result.json
          retention-days: 7
