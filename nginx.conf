# Пример конфигурации Nginx для konstruct.cc
# Разместите эту конфигурацию в вашем nginx конфиге для домена konstruct.cc

server {
    listen 80;
    listen [::]:80;
    server_name konstruct.cc www.konstruct.cc;
    
    # Редирект на HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name konstruct.cc www.konstruct.cc;

    # SSL настройки (замените на ваши пути к сертификатам)
    # ssl_certificate /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;

    root /path/to/construct-landing;
    index index.html;

    # Обработка контактных ссылок /c/{userId} (legacy unsigned)
    location ~ ^/c/([^/]+)$ {
        # Редирект на contact.html с параметрами
        rewrite ^/c/(.+)$ /contact.html?userId=$1&$args last;
    }

    # Dynamic invite links: https://konstruct.cc/add?invite=… (client Copy Contact Link)
    # Query string is preserved; page falls back to konstruct://add?invite=…
    location = /add {
        try_files /add.html =404;
    }
    location = /add.html {
        try_files $uri =404;
    }

    # Обслуживание apple-app-site-association для Universal Links
    location /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin *;
        # Важно: не использовать редиректы для этого файла
    }

    # Обслуживание статических файлов
    location / {
        try_files $uri $uri/ =404;
    }

    # Кэширование статических файлов
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

